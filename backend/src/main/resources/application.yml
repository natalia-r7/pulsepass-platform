spring:
  application:
    name: pulsepass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # P3-02: con Hibernate Validator en el classpath, Hibernate desactiva por defecto su
        # comprobación de nulos. Se reactiva para conservar el rechazo antes del INSERT que
        # verifican las pruebas de la Fase 1 (relaciones obligatorias venue, user y event).
        check_nullability: true

# PRD de Seguridad §14.2 (P4-03): configuración del JWT de acceso. El secreto se lee siempre del
# entorno; sin PULSEPASS_JWT_SECRET_BASE64 la aplicación no arranca (§12.2). Nunca un valor real aquí.
pulsepass:
  security:
    jwt:
      issuer: ${PULSEPASS_JWT_ISSUER:pulsepass-api}
      secret-base64: ${PULSEPASS_JWT_SECRET_BASE64}
      access-token-ttl: PT15M
